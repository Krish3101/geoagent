version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: geoagent_redis
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoagent_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEO_AGENT_SECRET_TOKEN=${GEO_AGENT_SECRET_TOKEN:-default_secret_token_123}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-3-27b-it}
      - DATABASE_URL=sqlite:///./geoagent.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./runs:/app/runs
    restart: always

volumes:
  redisdata:
