[project]
name = "geoagent-raster"
version = "0.1.0"
description = "Raster Agent microservice for GeoAgent"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "SQLAlchemy>=2.0.31",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "geopandas>=1.0.1",
    "shapely>=2.0.4",
    "osmnx>=2.0.0",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.8.0",
    "odc-stac>=0.3.9",
    "rioxarray>=0.15.0",
    "redis>=5.0.0",
    "geoagent-shared",
    "pytest",
    "python-multipart",
]

[tool.uv.sources]
geoagent-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
