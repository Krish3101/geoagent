[project]
name = "geoagent"
version = "0.1.0"
description = "Conversational assistant that turns plain-language requests into downloadable GIS files"
readme = "README.md"
authors = [{ name = "Krish Kalya", email = "krishkalya31012005@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "pydantic-ai-slim[openai]>=0.4",
  "sqlalchemy[asyncio]>=2.0.31",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "geopandas>=1.0",
  "shapely>=2.0",
  "osmnx>=2.0",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "odc-stac>=0.3.9",
  "rioxarray>=0.15",
  "numpy>=1.26",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "requests>=2.32",
  "pydantic>=2.9",
  "openai>=3.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
