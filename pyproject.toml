[project]
name = "geoagent"
version = "0.2.0"
description = "Unified GeoAgent powered by PydanticAI"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "pydantic-ai>=0.0.18",
    "SQLAlchemy>=2.0.31",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "geopandas>=1.0.1",
    "shapely>=2.0.4",
    "osmnx>=2.0.0",
    "redis>=5.0.0",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
